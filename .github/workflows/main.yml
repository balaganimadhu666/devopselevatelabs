name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run manually from the Actions tab

permissions:
  contents: read

env:
  IMAGE_NAME: nodejs-demo-app

jobs:
  # ---------- Job 1: install dependencies and run tests ----------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ---------- Job 2: build the image, smoke test it, push to Docker Hub ----------
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: test # only runs if tests pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build image (local, for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 3000:3000 ${{ env.IMAGE_NAME }}:ci-test
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:3000/health; then
              echo && echo "Container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container failed health check" && docker logs smoke
          exit 1

      - name: Push image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
